name: GitHub release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag or branch to build"
        required: true
        default: ""
      prerelease:
        description: "Mark the draft release as a prerelease"
        required: true
        type: boolean
        default: false
      recreate_release:
        description: "Delete an existing release and tag before publishing"
        required: true
        type: boolean
        default: false
      smoke_run:
        description: "Build all platforms; skip release publication."
        type: boolean
        default: false
      windows_only:
        description: "Build only Windows; skip release publication."
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  preflight:
    name: Validate shared toolchain
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      BOORUSAMA_USE_FVM: "false"
    steps:
      - name: Check out Boorusama
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.release_tag || github.ref }}
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version-file: .fvmrc
          cache: true
      - name: Validate Flutter and Dart dependencies
        shell: bash
        run: |
          set -euo pipefail
          flutter --version
          dart --version
          flutter pub get --enforce-lockfile

  build:
    needs: preflight
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: apk
            os: ubuntu-latest
            artifact_name: boorusama-apk
          - target: linux-tar.gz
            os: ubuntu-latest
            artifact_name: boorusama-linux-tar-gz
          - target: appimage
            os: ubuntu-latest
            artifact_name: boorusama-appimage
    env:
      BOORUSAMA_USE_FVM: "false"
      OUTPUT_DIR: release-artifacts/${{ matrix.target }}
    steps:
      - name: Check out Boorusama
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.release_tag || github.ref }}

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version-file: .fvmrc
          cache: true

      - name: Set up Android SDK
        if: matrix.target == 'apk'
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Install Android SDK packages
        if: matrix.target == 'apk'
        shell: bash
        working-directory: packages/boorusama_cli
        run: dart run boorusama_cli:boorusama setup android-sdk --ci

      - name: Install Linux native build tools
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y meson ninja-build nasm

      - name: Install system dependencies
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            ninja-build \
            meson \
            nasm \
            yasm \
            pkg-config \
            python3 \
            git \
            unzip \
            libgtk-3-dev \
            liblzma-dev \
            libmpv-dev \
            libgstreamer1.0-dev \
            libgstreamer-plugins-base1.0-dev \
            libunwind-dev \
            libsecret-1-dev \
            libjsoncpp-dev \
            libgl1-mesa-dev \
            libx11-dev \
            libxrandr-dev \
            libxinerama-dev \
            libxcursor-dev \
            libxi-dev \
            libavcodec-dev \
            libavformat-dev \
            libavutil-dev \
            libswscale-dev \
            libaom-dev \
            libdav1d-dev \
            libyuv-dev

      - name: Install Windows build and packaging dependencies
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $buildPath = $env:PATH
          choco install meson ninja nasm --yes --no-progress
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Import-Module "$env:ChocolateyInstall\helpers\chocolateyProfile.psm1"
          Update-SessionEnvironment
          $nasmDirectory = Join-Path $env:ProgramFiles 'NASM'
          if (-not (Test-Path (Join-Path $nasmDirectory 'nasm.exe'))) {
            throw "Installed NASM was not found in $nasmDirectory"
          }
          $env:PATH = (("$nasmDirectory;$buildPath;$env:PATH" -split ';' | Where-Object {
            $_ -and $_.Trim().Trim('"').TrimEnd('\', '/') -notmatch '(?i)[\\/]Strawberry[\\/]c[\\/]bin$'
          }) | Select-Object -Unique) -join ';'
          "PATH=$env:PATH" | Add-Content -Path $env:GITHUB_ENV
          Get-Command Compress-Archive

      - name: Select Visual Studio CMake for Windows native builds
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          $installation = & $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 Microsoft.VisualStudio.Component.VC.CMake.Project -property installationPath
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not $installation) { throw 'Visual Studio with C++ and CMake tools was not found.' }
          $cmake = Join-Path $installation 'Common7\IDE\CommonExtensions\Microsoft\CMake\CMake\bin\cmake.exe'
          if (-not (Test-Path $cmake)) { throw "Visual Studio CMake was not found: $cmake" }
          "CMAKE=$cmake" | Add-Content -Path $env:GITHUB_ENV
          Split-Path $cmake | Add-Content -Path $env:GITHUB_PATH
          Write-Host "Using CMake: $cmake"
          & $cmake --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Install Apple build and packaging dependencies
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          brew install create-dmg meson ninja nasm
          sudo gem install cocoapods

      - name: Check native build tools
        shell: bash
        run: |
          set -euo pipefail
          meson --version
          ninja --version
          nasm --version

      - name: Enable Git long paths on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: git config --global core.longpaths true

      - name: Check Windows compiler cache selection
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          foreach ($name in @('ccache', 'sccache')) {
            $tool = Get-Command $name -CommandType Application -ErrorAction SilentlyContinue
            if ($tool) {
              Write-Host "Using ${name}: $($tool.Source)"
              if ($tool.Source -match '(?i)[\\/]Strawberry[\\/]c[\\/]bin[\\/]') {
                throw "Strawberry compiler tools must not be on the build PATH: $($tool.Source)"
              }
              & $tool.Source --version
              if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            }
          }

      - name: Initialize workspace
        shell: bash
        run: |
          set -euo pipefail
          ./init.sh

      - name: Build GitHub release artifact
        shell: bash
        run: |
          set -euo pipefail
          args=(
            release
            github
            build
            "${{ matrix.target }}"
            --ci
            --allow-dirty
            --output-dir
            "$OUTPUT_DIR"
          )
          if [[ "${{ matrix.target }}" == "ipa" ]]; then
            args+=(--no-codesign)
          fi
          if [[ "${{ matrix.target }}" == "windows-zip" ]]; then
            args+=(--flutter-verbose)
          fi
          ./build.sh "${args[@]}" 2>&1 | tee "$RUNNER_TEMP/boorusama-build.log"

      - name: Upload build diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: diagnostics-${{ matrix.target }}
          include-hidden-files: true
          retention-days: 7
          path: |
            ${{ runner.temp }}/boorusama-build.log
            .dart_tool/hooks_runner/**/stdout.txt
            .dart_tool/hooks_runner/**/stderr.txt
            .dart_tool/hooks_runner/**/meson-log.txt

      - name: Upload release artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ env.OUTPUT_DIR }}/**
          if-no-files-found: error

  publish:
    if: github.actor ==  !inputs.smoke_run
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      BOORUSAMA_USE_FVM: "false"
    steps:
      - name: Check out Boorusama
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.release_tag || github.ref }}

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version-file: .fvmrc
          cache: true

      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          path: release-assets

      - name: Delete existing release
        if: inputs.recreate_release || github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail
          TAG="${{ inputs.release_tag || github.ref_name }}"
          gh release delete "$TAG" \
            --repo "${{ github.repository }}" \
            --cleanup-tag \
            --yes || true

      - name: Publish draft GitHub release
        shell: bash
        run: |
          set -euo pipefail
          TAG="${{ inputs.release_tag || github.ref_name }}"
          args=(
            release
            github
            publish
            --ci
            --repo
            "${{ github.repository }}"
            --artifacts-dir
            release-assets
            --target apk
            --target linux-tar.gz
            --target appimage
          )
          args+=(--tag "$TAG")
          args+=(--title "Boorusama $TAG")
          if [[ "${{ inputs.prerelease }}" == "true" || "$TAG" == *"beta"* || "$TAG" == *"alpha"* ]]; then
            args+=(--prerelease)
          fi
          ./build.sh "${args[@]}"
