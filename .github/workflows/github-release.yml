name: GitHub release

on:
  workflow_dispatch:
    inputs:
      draft:
        description: "Create the release as a draft for manual review"
        required: true
        type: boolean
        default: false
      prerelease:
        description: "Mark the release as a prerelease"
        required: true
        type: boolean
        default: false
      recreate_release:
        description: "Delete an existing release and tag before publishing"
        required: true
        type: boolean
        default: false
      smoke_run:
        description: "Build artifacts; skip release publication."
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  preflight:
    name: Validate shared toolchain
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      BOORUSAMA_USE_FVM: "false"
    steps:
      - name: Check out Boorusama
        uses: actions/checkout@v6
        with:
          ref: ${{ github.ref }}
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version-file: .fvmrc
          cache: true
      - name: Validate Flutter and Dart dependencies
        shell: bash
        run: |
          set -euo pipefail
          flutter --version
          dart --version
          flutter pub get --enforce-lockfile

  build:
    needs: preflight
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: apk
            os: ubuntu-24.04
            artifact_name: boorusama-apk
          - target: linux-tar.gz
            os: ubuntu-24.04
            artifact_name: boorusama-linux-tar-gz
          - target: appimage
            os: ubuntu-24.04
            artifact_name: boorusama-appimage
    env:
      BOORUSAMA_USE_FVM: "false"
      OUTPUT_DIR: release-artifacts/${{ matrix.target }}
    steps:
      - name: Check out Boorusama
        uses: actions/checkout@v6
        with:
          ref: ${{ github.ref }}

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version-file: .fvmrc
          cache: true

      - name: Set up Android SDK
        if: matrix.target == 'apk'
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Install Android SDK packages
        if: matrix.target == 'apk'
        shell: bash
        working-directory: packages/boorusama_cli
        run: dart run boorusama_cli:boorusama setup android-sdk --ci

      # Without key.properties Gradle falls back to the keystore committed at
      # android/keystore/debug.jks. That key is stable between CI runs, so APKs
      # from this workflow can still update each other. Only require the
      # release secrets when at least one of them is configured.
      - name: Configure Android release signing
        if: matrix.target == 'apk' && !inputs.smoke_run
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          missing=()
          for name in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [[ -z "${!name}" ]]; then
              missing+=("$name")
            fi
          done
          if [[ ${#missing[@]} -eq 4 ]]; then
            echo "::warning::Android signing secrets are not configured; signing the APK with the committed debug keystore (android/keystore/debug.jks)."
            exit 0
          fi
          if [[ ${#missing[@]} -gt 0 ]]; then
            for name in "${missing[@]}"; do
              echo "::error::Missing Android signing secret for $name"
            done
            exit 1
          fi
          keystore="$RUNNER_TEMP/release.jks"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$keystore"
          {
            echo "storeFile=$keystore"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > android/key.properties

      - name: Force baseline x86-64 ISA for Linux artifacts
        if: matrix.target != 'apk'
        shell: bash
        run: |
          {
            echo "CFLAGS=-march=x86-64"
            echo "CXXFLAGS=-march=x86-64"
          } >> "$GITHUB_ENV"

      - name: Install Linux native build tools
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y meson ninja-build nasm

      - name: Install system dependencies
        if: runner.os == 'Linux' && matrix.target != 'apk'
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            ninja-build \
            meson \
            nasm \
            yasm \
            pkg-config \
            python3 \
            git \
            unzip \
            libgtk-3-dev \
            liblzma-dev \
            libmpv-dev \
            libgstreamer1.0-dev \
            libgstreamer-plugins-base1.0-dev \
            libunwind-dev \
            libsecret-1-dev \
            libjsoncpp-dev \
            libgl1-mesa-dev \
            libx11-dev \
            libxrandr-dev \
            libxinerama-dev \
            libxcursor-dev \
            libxi-dev \
            libavcodec-dev \
            libavformat-dev \
            libavutil-dev \
            libswscale-dev \
            libaom-dev \
            libdav1d-dev \
            libyuv-dev

      - name: Check native build tools
        shell: bash
        run: |
          set -euo pipefail
          meson --version
          ninja --version
          nasm --version

      - name: Initialize workspace
        shell: bash
        run: |
          set -euo pipefail
          ./init.sh

      - name: Build GitHub release artifact
        shell: bash
        run: |
          set -euo pipefail
          args=(
            release
            github
            build
            "${{ matrix.target }}"
            --ci
            --allow-dirty
            --output-dir
            "$OUTPUT_DIR"
          )
          ./build.sh "${args[@]}" 2>&1 | tee "$RUNNER_TEMP/boorusama-build.log"

      - name: Upload build diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: diagnostics-${{ matrix.target }}
          include-hidden-files: true
          retention-days: 7
          path: |
            ${{ runner.temp }}/boorusama-build.log
            .dart_tool/hooks_runner/**/stdout.txt
            .dart_tool/hooks_runner/**/stderr.txt
            .dart_tool/hooks_runner/**/meson-log.txt

      - name: Upload release artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ env.OUTPUT_DIR }}/**
          if-no-files-found: error

  publish:
    if: ${{ !inputs.smoke_run }}
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      BOORUSAMA_USE_FVM: "false"
    steps:
      - name: Check out Boorusama
        uses: actions/checkout@v6
        with:
          ref: ${{ github.ref }}

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version-file: .fvmrc
          cache: true

      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          path: release-assets

      - name: Delete existing release
        if: inputs.recreate_release
        shell: bash
        run: |
          set -euo pipefail
          TAG="${{ github.ref_name }}"
          gh release delete "$TAG" \
            --repo "${{ github.repository }}" \
            --cleanup-tag \
            --yes || true

      - name: Publish GitHub release
        shell: bash
        run: |
          set -euo pipefail
          TAG="${{ github.ref_name }}"
          # The tag is taken from whatever ref the workflow was started on —
          # a v* tag or any branch (side branches included). A release cut
          # from a branch can be flipped to a draft in the GitHub UI after
          # publishing, or created as one up front via the draft input.
          echo "::notice::Creating release '$TAG' from ref '${{ github.ref }}'."
          args=(
            release
            github
            publish
            --ci
            --repo
            "${{ github.repository }}"
            --artifacts-dir
            release-assets
            --target apk
            --target linux-tar.gz
            --target appimage
          )
          if [[ "${{ inputs.draft }}" != "true" ]]; then
            args+=(--no-draft)
          fi
          args+=(--tag "$TAG")
          args+=(--title "Boorusama $TAG")
          if [[ "${{ inputs.prerelease }}" == "true" || "$TAG" == *"beta"* || "$TAG" == *"alpha"* ]]; then
            args+=(--prerelease)
          fi
          ./build.sh "${args[@]}"
