name: GitHub release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag to build and publish."
        required: true
        default: ""
      prerelease:
        description: "Mark the draft release as a prerelease"
        required: true
        type: boolean
        default: false
      recreate_release:
        description: "Delete an existing release and tag before publishing"
        required: true
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: apk
            os: ubuntu-latest
            artifact_name: boorusama-apk
          - target: linux-tar.gz
            os: ubuntu-latest
            artifact_name: boorusama-linux-tar-gz
          - target: appimage
            os: ubuntu-latest
            artifact_name: boorusama-appimage

    env:
      BOORUSAMA_USE_FVM: "false"
      OUTPUT_DIR: release-artifacts/${{ matrix.target }}

    steps:
      - name: Check out Boorusama
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.release_tag || github.ref }}

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.0
          cache: true

      - name: Set up Android SDK
        if: matrix.target == 'apk'
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        if: matrix.target == 'apk'
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager --install "platforms;android-36" "build-tools;36.0.0" "ndk;28.2.13676358"

      - name: Install system dependencies
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            ninja-build \
            meson \
            nasm \
            yasm \
            pkg-config \
            python3 \
            git \
            unzip \
            libgtk-3-dev \
            liblzma-dev \
            libmpv-dev \
            libgstreamer1.0-dev \
            libgstreamer-plugins-base1.0-dev \
            libunwind-dev \
            libsecret-1-dev \
            libjsoncpp-dev \
            libgl1-mesa-dev \
            libx11-dev \
            libxrandr-dev \
            libxinerama-dev \
            libxcursor-dev \
            libxi-dev \
            libavcodec-dev \
            libavformat-dev \
            libavutil-dev \
            libswscale-dev \
            libaom-dev \
            libdav1d-dev \
            libyuv-dev

      - name: Initialize workspace
        shell: bash
        run: |
          set -euo pipefail
          ./init.sh

      - name: Build GitHub release artifact
        shell: bash
        run: |
          set -euo pipefail

          args=(
            release
            github
            build
            "${{ matrix.target }}"
            --ci
            --allow-dirty
            --output-dir
            "$OUTPUT_DIR"
          )

          ./build.sh "${args[@]}"

      - name: Upload release artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ env.OUTPUT_DIR }}/**
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      BOORUSAMA_USE_FVM: "false"

    steps:
      - name: Check out Boorusama
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.release_tag || github.ref }}

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.0
          cache: true

      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          path: release-assets

      - name: Delete existing release
        if: inputs.recreate_release || github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail
          TAG="${{ inputs.release_tag || github.ref_name }}"
          gh release delete "$TAG" \
            --repo "${{ github.repository }}" \
            --cleanup-tag \
            --yes || true

      - name: Publish draft GitHub release
        shell: bash
        run: |
          set -euo pipefail
          TAG="${{ inputs.release_tag || github.ref_name }}"

          args=(
            release
            github
            publish
            --ci
            --repo
            "${{ github.repository }}"
            --artifacts-dir
            release-assets
            --target apk
            --target linux-tar.gz
            --target appimage
          )

          args+=(--tag "$TAG")
          args+=(--title "Boorusama $TAG")

          if [[ "${{ inputs.prerelease }}" == "true" || "$TAG" == *"beta"* || "$TAG" == *"alpha"* ]]; then
            args+=(--prerelease)
          fi

          ./build.sh "${args[@]}"
